aid: klaimee
name: Klaimee
description: Klaimee is a Y Combinator (Spring/P26 batch) startup building certification,
  financial guarantee, and liability insurance for AI agents running in production.
  The company evaluates an autonomous agent across risk dimensions such as scope,
  data exfiltration, unauthorized action, output integrity, adversarial manipulation,
  behavioral stability, model drift, and operational control, then issues a letter-graded
  certification report with remediation guidance and a Klaimee-Verified badge that AI
  vendors use to clear enterprise procurement. Certified agents are backed by a financial
  guarantee and by AI liability insurance priced against the certification score, covering
  the gap that traditional errors-and-omissions and cyber policies explicitly exclude —
  hallucinated outputs, unauthorized actions, data exposure, prompt injection, and wrongful
  commitments. Klaimee also runs a public adversarial-testing playground where teams can
  stress-test an agent with probes for prompt injection, jailbreak, decision drift, data
  leakage, and biased outputs. Klaimee currently sells a human-delivered certification and
  underwriting service; it publishes no public API, SDK, or developer documentation as of
  this enrichment pass. Founded in 2026 by Ines Boutemadja (CEO) and Julien Catonnet (CTO),
  based in San Francisco.
